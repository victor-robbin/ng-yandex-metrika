name: Релиз пакета

on:
  push:
    tags:
      - 'v22.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Получить готовый пакет
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Настроить Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
      - name: Проверить тег и состав пакета
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          const p = JSON.parse(readFileSync('package.json', 'utf8'));
          if (p.private || process.env.GITHUB_REF_NAME !== `v${p.version}`) {
            throw new Error('Тег должен совпадать с версией готового пакета');
          }
          for (const file of [p.typings, p.module, 'README.md', 'LICENSE', 'RELEASE_NOTES.md']) {
            if (!file || !existsSync(file)) throw new Error(`Отсутствует файл пакета: ${file}`);
          }
          JS
      - name: Упаковать пакет и вычислить контрольную сумму
        run: |
          npm pack --ignore-scripts
          sha256sum *.tgz > SHA256SUMS
      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" *.tgz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$RELEASE_TAG — Angular 22" --notes-file RELEASE_NOTES.md
